name: Delete arquivos errados

on:
  workflow_dispatch:

jobs:
  delete-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Delete arquivos indesejados
        run: |
          rm -f "base de sintomas.xlsx"
          rm -f "base_de_sintomas.xlsx"
          rm -f "base_de_sintomas.xlsx.xlsx"
          rm -f "chatbot-especialidades-main.zip"

      - name: Commit deletions
        run: |
          git config user.name "filipecarmo"
          git config user.email "filipecarmo@users.noreply.github.com"
          git add -A
          git commit -m "Remoção de arquivos errados"
          git push
