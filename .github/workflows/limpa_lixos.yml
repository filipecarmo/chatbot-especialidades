name: Delete arquivos errados

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Delete arquivos indesejados
        run: |
          rm -f "base de sintomas.xlsx" || true
          rm -f "base_de_sintomas.xlsx" || true
          rm -f "base_de_sintomas.xlsx.xlsx" || true
          rm -f "chatbot-especialidades-main.zip" || true
          git rm -f "base de sintomas.xlsx" || true
          git rm -f "base_de_sintomas.xlsx" || true
          git rm -f "base_de_sintomas.xlsx.xlsx" || true
          git rm -f "chatbot-especialidades-main.zip" || true

      - name: Commit deletions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Remover arquivos errados" || echo "Nada para commitar"
          git push
